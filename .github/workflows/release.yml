name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time; never cancel a release that is publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit, tag and GitHub release
      id-token: write # crates.io Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Exchanges the workflow's OIDC token for a short-lived crates.io token.
      # Requires Trusted Publishing to be configured for both crates.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
