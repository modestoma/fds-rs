# as a demonstration of an API spec in YAML
swagger: '2.0'
info:
  title: FDS Restful API
  description: Delete Bucket related api supported by FDS
  version: "1.0.0"
# the domain of the service
host: awsbj0.fds.api.xiaomi.com
# array of all schemes that your API supports
schemes:
  - https
  - http
# will be prefixed to all paths
produces:
  - |
paths:
  /{bucketname}:
    head:
      summary: 查看Bucket是否存在
      description: 需要有Bucket的`READ`权限
      parameters:
        - name: bucketname
          in: path
          description: bucket名字
          required: true
          type: string
        - name: authorization
          in: header
          description: 认证信息，计算方式参考签名认证相关文档
          required: false
          type: string
        - name: Date
          in: header
          description: 请求时间
          required: true
          type: string
      tags:
        - head-bucket
      responses:
        200:
          description: bucket存在
        403:
          description: bucket存在，但没有权限读取bucket
        404:
          description: bucket不存在
