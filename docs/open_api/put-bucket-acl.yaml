# as a demonstration of an API spec in YAML
swagger: '2.0'
info:
  title: FDS Restful API
  description: Add/Delete bucket acl related api supported by FDS
  version: "1.0.0"
# the domain of the service
host: awsbj0.fds.api.xiaomi.com
# array of all schemes that your API supports
schemes:
  - https
  - http
# will be prefixed to all paths
produces:
  - |
paths:
  /{bucketname}:
    put:
      summary: 修改Bucket的ACL
      description: 只有Bucket的拥有者才能执行这个操作
      consumes:
        - application/json
      parameters:
        - name: bucketname
          in: path
          description: Bucket名字
          required: true
          type: string
        - name: authorization
          in: header
          description: 认证信息，计算方式参考签名认证相关文档
          required: true
          type: string
        - name: Date
          in: header
          description: 请求时间
          required: true
          type: string
        - name: acl
          in: query
          description: 表示该请求是为Bucket的ACL操作，值为空
          required: true
          type: string
        - name: action
          in: query
          description: 执行的操作，如果是`delete`，表示删除ACL，缺省为添加ACL
          required: false
          type: string
        - name: body
          in: body
          type: object
          required: true
          schema:
            $ref: '#/definitions/AccessControlPolicy'
          description: 需要修改的 ACL 信息
      tags:
        - Set Bucket ACL
      responses:
        200:
          description: 请求成功
definitions:
  AccessControlPolicy:
    type: object
    properties:
      owner:
        $ref: '#/definitions/OwnerBean'
      accessControlList:
        type: array
        items:
          $ref: '#/definitions/GrantBean'
  GrantBean:
    type: object
    properties:
      grantee:
        $ref: '#/definitions/GranteeBean'
      permission:
        type: string
        description: 权限描述，包括`READ`, `WRITE`, `READ_OBJECTS`, `FULL_CONTROL`, `SSO_WRITE`
      type:
        type: string
        description: 授权对象类型，包括`USER`, `GROUP`
  GranteeBean:
    type: object
    properties:
      id:
        type: string
        description: 用户ID
  OwnerBean:
    type: object
    properties:
      id:
        type: string
        description: 所有者ID
      displayName:
        type: string
        description: 所有者名称
