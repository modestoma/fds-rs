# as a demonstration of an API spec in YAML
swagger: '2.0'
info:
  title: FDS Restful API
  description: Get object acl related api supported by FDS
  version: "1.0.0"
# the domain of the service
host: awsbj0.fds.api.xiaomi.com
# array of all schemes that your API supports
schemes:
  - https
  - http
# will be prefixed to all paths
produces:
  - application/json
paths:
  /{bucketname}/{objectname}:
    get:
      summary: 获取object的ACL信
      description: 必须拥有Object的`READ`权限才能执行该操作
      parameters:
        - name: bucketname
          in: path
          description: Bucket名字
          required: true
          type: string
        - name: objectname
          in: path
          description: Object名字
          required: true
          type: string
        - name: acl
          in: query
          description: 表示acl操作，值为空
          type: string
          required: true
        - name: authorization
          in: header
          description: 认证信息，计算方式参考签名认证相关文档
          required: false
          type: string
        - name: Date
          in: header
          description: 请求时间
          required: true
          type: string
      tags:
        - get object acl
      responses:
        200:
          description: 请求成功，返回Object的ACL信息
          schema:
            $ref: '#/definitions/AccessControlPolicy'
definitions:
  AccessControlPolicy:
    type: object
    properties:
      owner:
        $ref: '#/definitions/OwnerBean'
      accessControlList:
        type: array
        items:
          $ref: '#/definitions/GrantBean'
  GrantBean:
    type: object
    properties:
      grantee:
        $ref: '#/definitions/GranteeBean'
      permission:
        type: string
        description: 权限描述，包括`READ`, `FULL_CONTROL`
      type:
        type: string
        description: 授权对象类型，包括`USER`, `GROUP`
  GranteeBean:
    type: object
    properties:
      id:
        type: string
        description: 用户ID
  OwnerBean:
    type: object
    properties:
      id:
        type: string
        description: 所有者ID
      displayName:
        type: string
        description: 所有者名称