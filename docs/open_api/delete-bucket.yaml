# as a demonstration of an API spec in YAML
swagger: '2.0'
info:
  title: FDS Restful API
  description: Delete Bucket related api supported by FDS
  version: "1.0.0"
# the domain of the service
host: awsbj0.fds.api.xiaomi.com
# array of all schemes that your API supports
schemes:
  - https
  - http
# will be prefixed to all paths
produces:
  - |
paths:
  /{bucketname}:
    delete:
      summary: 删除Bucket
      description: 必须是Bucket的拥有者才能操作，删除Bucket前必须删除Bucket下的所有Object
      parameters:
        - name: bucketname
          in: path
          description: bucket名字
          required: true
          type: string
        - name: authorization
          in: header
          description: 认证信息，计算方式参考签名认证相关文档
          required: true
          type: string
        - name: Date
          in: header
          description: 请求时间
          required: true
          type: string
      tags:
        - delete bucket
      responses:
        200:
          description: 请求成功
