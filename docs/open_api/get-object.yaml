# as a demonstration of an API spec in YAML
swagger: '2.0'
info:
  title: FDS Restful API
  description: Get object related api supported by FDS
  version: "1.0.0"
# the domain of the service
host: awsbj0.fds.api.xiaomi.com
# array of all schemes that your API supports
schemes:
  - https
  - http
# will be prefixed to all paths
paths:
  /{bucketname}/{objectname}:
    get:
      summary: 获取object
      description: 必须拥有Object的`READ`权限才能执行该操作
      parameters:
        - name: bucketname
          in: path
          description: Bucket名字
          required: true
          type: string
        - name: objectname
          in: path
          description: Object名字
          required: true
          type: string
        - name: authorization
          in: header
          description: 认证信息，计算方式参考签名认证相关文档
          required: false
          type: string
        - name: Date
          in: header
          description: 请求时间
          required: true
          type: string
        - name: Range
          in: header
          description: 符合http协议的range请求参数，例如读取文件前1K字节`bytes=0-1023`，跳过第一个字节读取文件剩余内容`bytes=0-`
          required: false
          type: string
      tags:
        - get object
      responses:
        200:
          description: 请求成功，返回的body里包含Object的内容，头部包含Object的metadata
