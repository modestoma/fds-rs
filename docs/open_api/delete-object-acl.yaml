# as a demonstration of an API spec in YAML
swagger: '2.0'
info:
  title: FDS Restful API
  description: Delete object acl related api supported by FDS
  version: "1.0.0"
# the domain of the service
host: awsbj0.fds.api.xiaomi.com
# array of all schemes that your API supports
schemes:
  - https
  - http
# will be prefixed to all paths
paths:
  /{bucketname}/{objectname}:
    put:
      summary: 删除object的ACL信息
      description: 必须是Object的拥有者，或者拥有Bucket的`FULL_CONTROL`权限，才能执行该操作；被删除的ACL列表中的grantee不能包含发起改操作的用户（用户无法删除自己的ACL）
      parameters:
        - name: bucketname
          in: path
          description: Bucket名字
          required: true
          type: string
        - name: objectname
          in: path
          description: Object名字
          required: true
          type: string
        - name: acl
          in: query
          description: 表示acl操作，值为空
          type: string
          required: true
        - name: action
          in: query
          description: 值为`delete`,表示执行删除操作
          type: string
          required: true
        - name: authorization
          in: header
          description: 认证信息，计算方式参考签名认证相关文档
          required: true
          type: string
        - name: Date
          in: header
          description: 请求时间
          required: true
          type: string
        - name: body
          in: body
          description: 需要删除的ACL信息
          type: object
          required: true
          schema:
            $ref: '#/definitions/AccessControlPolicy'
      tags:
        - delete object acl
      responses:
        200:
          description: 请求成功
definitions:
  AccessControlPolicy:
    type: object
    properties:
      owner:
        $ref: '#/definitions/OwnerBean'
      accessControlList:
        type: array
        items:
          $ref: '#/definitions/GrantBean'
  GrantBean:
    type: object
    properties:
      grantee:
        $ref: '#/definitions/GranteeBean'
      permission:
        type: string
        description: 权限描述，包括`READ`, `FULL_CONTROL`
      type:
        type: string
        description: 授权对象类型，包括`USER`, `GROUP`
  GranteeBean:
    type: object
    properties:
      id:
        type: string
        description: 用户ID
  OwnerBean:
    type: object
    properties:
      id:
        type: string
        description: 所有者ID
      displayName:
        type: string
        description: 所有者名称
