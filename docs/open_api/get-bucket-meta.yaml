# as a demonstration of an API spec in YAML
swagger: '2.0'
info:
  title: FDS Restful API
  description: Get bucket meta related api supported by FDS
  version: "1.0.0"
# the domain of the service
host: awsbj0.fds.api.xiaomi.com
# array of all schemes that your API supports
schemes:
  - https
  - http
# will be prefixed to all paths
produces:
  - application/json
paths:
  /{bucketname}:
    get:
      summary: 获取Bucket的meta
      description: 必须拥有Bucket的`READ`权限才能执行该操作
      parameters:
        - name: bucketname
          in: path
          description: Bucket名字
          required: true
          type: string
        - name: authorization
          in: header
          description: 认证信息，计算方式参考签名认证相关文档
          required: true
          type: string
        - name: Date
          in: header
          description: 请求时间
          required: true
          type: string
      tags:
        - get bucket meta
      responses:
        200:
          description: Get Bucket meta
          schema:
            $ref: '#/definitions/FDSBucketMeta'
definitions:
  FDSBucketMeta:
    type: object
    properties:
      creationTime:
        type: integer
        format: int64
        description: 创建时间UTC，单位毫秒
      name:
        type: string
        description: Bucket名字
      numObjects:
        type: integer
        format: int64
        description: 这个Bucket下的object数量
      usedSpace:
        type: integer
        format: int64
        description: 使用的容量，单位byte