[package]
name = "fds"
version = "0.2.0"
edition = "2021"
rust-version = "1.86"
description = "Rust SDK for XiaoMi FDS (File Data Storage) object storage"
license = "Apache-2.0"
publish = ["artifactory"]

[lib]
name = "fds"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
base64 = "0.22"
hex = "0.4"
bytes = "1"
http = "1"
tokio-util = { version = "0.7", features = ["io", "rt"] }
futures-util = "0.3"
thiserror = "1"
tracing = "0.1"

# Optional features
governor = { version = "0.6", optional = true }        # manager rate limiting
arc-swap = { version = "1", optional = true }          # cslb atomic node list
async-trait = { version = "0.1", optional = true }     # cslb Service trait
dashmap = { version = "6", optional = true }           # cslb group / metrics

[features]
default = ["manager"]
manager = ["dep:governor"]
cslb = ["dep:arc-swap", "dep:async-trait", "dep:dashmap"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
mockito = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[[example]]
name = "download"
required-features = ["manager"]

[[example]]
name = "download_memory"
required-features = ["manager"]
