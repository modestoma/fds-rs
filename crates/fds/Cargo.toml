[package]
name = "fds"
version = "0.2.0"
edition = "2021"
rust-version = "1.86"
description = "Rust SDK for XiaoMi FDS (File Data Storage) object storage"
license = "Apache-2.0"
publish = ["artifactory"]

[lib]
name = "fds"
path = "src/lib.rs"

[dependencies]
# Only what the library uses; the runtime flavor is the application's choice.
# rt: spawn_blocking/JoinSet/yield_now; macros: select!; cslb adds sync + net.
tokio = { version = "1", features = ["rt", "macros", "fs", "io-util", "time"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
base64 = "0.22"
hex = "0.4"
bytes = "1"
http = "1"
http-body = "1"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
thiserror = "2"
tracing = "0.1"

# Optional features
governor = { version = "0.6", optional = true }        # manager rate limiting
arc-swap = { version = "1", optional = true }          # cslb atomic node list
dashmap = { version = "6", optional = true }           # cslb group / metrics

[features]
default = ["manager"]
manager = ["dep:governor", "tokio-util/rt"]
cslb = ["dep:arc-swap", "dep:dashmap", "tokio/sync", "tokio/net"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
mockito = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[[example]]
name = "download"
required-features = ["manager"]

[[example]]
name = "download_memory"
required-features = ["manager"]
