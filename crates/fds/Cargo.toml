[package]
name = "fds-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Async Rust SDK for FDS (File Data Storage) object storage"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/fds-rs"
readme = "README.md"
keywords = ["fds", "object-storage", "storage", "sdk", "async"]
categories = ["api-bindings", "asynchronous", "web-programming::http-client"]
include = ["src/**/*", "examples/**/*", "tests/**/*", "README.md", "LICENSE"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "fds"
path = "src/lib.rs"

[dependencies]
# Only what the library uses; the runtime flavor is the application's choice.
# rt: spawn_blocking/JoinSet/yield_now; macros: select!; sync: the token
# refresh single flight; cslb adds net.
tokio = { version = "1", features = ["rt", "macros", "sync", "fs", "io-util", "time"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
base64 = "0.22"
hex = "0.4"
bytes = "1"
http = "1"
http-body = "1"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
tracing = "0.1"

# Optional features
governor = { version = "0.6", optional = true }        # manager rate limiting

[features]
default = ["manager"]
manager = ["dep:governor", "tokio-util/rt"]
# Installs the internal CSLB DNS resolver in Client; no public API of its own.
cslb = ["tokio/net"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
mockito = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[[example]]
name = "download"
required-features = ["manager"]

[[example]]
name = "download_memory"
required-features = ["manager"]
