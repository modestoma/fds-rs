[package]
name = "fds_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Command-line tool for XiaoMi FDS object storage, built on the fds-rs SDK"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["fds", "xiaomi", "object-storage", "cli"]
categories = ["command-line-utilities"]
include = ["src/**/*", "tests/**/*", "README.md", "LICENSE"]

[[bin]]
name = "fds_cli"
path = "src/main.rs"

[features]
cslb = ["fds/cslb"]

[dependencies]
fds = { workspace = true, features = ["manager"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std", "signal", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
mockito = "1"
